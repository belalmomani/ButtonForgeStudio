name: Perf baseline (JVM)
on:
  workflow_dispatch:
jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :integration-tests:perfTest --stacktrace | tee perf.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-baseline
          path: perf.txt
