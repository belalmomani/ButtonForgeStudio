name: CI
on:
  push:
  pull_request:
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Requires gradlew to be committed (see README).
      - run: ./gradlew :geometry:test
