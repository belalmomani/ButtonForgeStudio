name: CI
on:
  push:
  pull_request:
jobs:
  jvm-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Installs Gradle itself, so no committed wrapper is needed yet.
      # When gradlew is committed, switch back to ./gradlew and drop gradle-version.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - run: gradle :geometry:test :document:test --continue --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geometry-test-reports
          path: |
            geometry/build/reports/tests/test
            document/build/reports/tests/test
